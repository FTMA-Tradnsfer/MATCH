<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>엘버턴 FC</title><style>
body{margin:0;background:#090810;color:#f7f4ff;font-family:system-ui,sans-serif}header{padding:22px 28px;background:#0e0c14;border-bottom:1px solid #302a3e}b{color:#d7b65e}.wrap{max-width:1100px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#15121d;border:1px solid #302a3e;border-radius:12px;padding:16px}.big{font-size:28px;font-weight:900}.muted{color:#9992a9;font-size:12px}.req{margin-top:12px;background:#20151c;border:1px solid #5a303a;border-radius:10px;padding:15px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}} 
</style></head><body><header><b>◆ ELVERTON FC</b><div class="muted">2026/27 · LIVE CLUB DATA</div></header><div class="wrap"><div class="grid"><div class="card"><div class="muted">선수단</div><div class="big">20</div></div><div class="card"><div class="muted">대기 요청</div><div class="big" id="n">-</div></div><div class="card"><div class="muted">시즌</div><div class="big">26/27</div></div><div class="card"><div class="muted">데이터</div><div class="big" id="sync">LIVE</div></div></div><div class="card" style="margin-top:16px"><h2>선수 요청</h2><div id="requests">불러오는 중...</div></div><div class="card" style="margin-top:16px"><h2>구단 소식</h2><div id="news"></div></div></div>
<script>
async function load(){try{const r=await fetch('elverton_data.json?v='+Date.now());const d=await r.json();const a=(d.requests||[]).filter(x=>x.status==='대기');document.getElementById('n').textContent=a.length;document.getElementById('requests').innerHTML=a.length?a.map(x=>'<div class="req"><b>#'+x.number+' '+x.player+'</b><div class="muted">'+x.type+'</div><p>'+x.message+'</p></div>').join(''):'<div class="muted">현재 대기 중인 선수 요청이 없습니다.</div>';document.getElementById('news').innerHTML=(d.news||[]).map(x=>'<p>'+x+'</p>').join('')||'<div class="muted">소식 없음</div>'}catch(e){document.getElementById('requests').textContent='데이터 연결 실패'}}load();setInterval(load,10000);
</script></body></html>
